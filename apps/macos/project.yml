# XcodeGen spec. The generated Fairspoken.xcodeproj is git-ignored: regenerate with
#   xcodegen generate        (or scripts/build.sh, which does it for you)
#
# Two apps share the packages under Packages/:
#   Fairspoken        → Fairspoken.app         (dictation client, ie.fairspoken.mac)
#   FairspokenServer  → Fairspoken Server.app  (transcription server, ie.fairspoken.server)
#
# Both update with Sparkle 2 (Packages/FairspokenUpdates). CFBundleVersion is CURRENT_PROJECT_VERSION
# (Config/Base.xcconfig); releases set it to the UTC build timestamp YYYYMMDDHHMM.
name: Fairspoken
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 1.10.0
  # In-app updates (both apps). Keep in step with Packages/FairspokenUpdates/Package.swift.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  FairspokenCore:
    path: Packages/FairspokenCore
  FairspokenSpeech:
    path: Packages/FairspokenSpeech
  FairspokenUI:
    path: Packages/FairspokenUI
  FairspokenHost:
    path: Packages/FairspokenHost
  FairspokenUpdates:
    path: Packages/FairspokenUpdates
targets:
  Fairspoken:
    type: application
    platform: macOS
    sources:
      - path: Fairspoken
        excludes:
          - Info.plist
    dependencies:
      - package: KeyboardShortcuts
      - package: FairspokenCore
      - package: FairspokenSpeech
      - package: FairspokenUI
      - package: FairspokenUpdates
      - package: Sparkle
    settings:
      # The Sparkle signing phase rewrites the embedded framework in place.
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Sign Sparkle helpers
        script: '"${SRCROOT}/scripts/sign-sparkle.sh"'
        basedOnDependencyAnalysis: false
        # The input orders this after Xcode embeds the package's framework (that copy is not a
        # build phase, so without it the two can run in parallel).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework
  FairspokenServer:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Server-Debug.xcconfig
      Release: Config/Server-Release.xcconfig
    sources:
      - path: FairspokenServer
        excludes:
          - Info.plist
          - LaunchAgent
      # The web dashboard is the Rust host's own file, bundled as-is (never copied by hand).
      - path: ../../src-tauri/src/host/dashboard.html
        buildPhase: resources
        group: FairspokenServer/Resources
    dependencies:
      - package: FairspokenCore
      - package: FairspokenSpeech
      - package: FairspokenUI
      - package: FairspokenHost
      - package: FairspokenUpdates
      - package: Sparkle
    settings:
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Sign Sparkle helpers
        script: '"${SRCROOT}/scripts/sign-sparkle.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework
schemes:
  Fairspoken:
    build:
      targets:
        Fairspoken: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: FairspokenCore/FairspokenCoreTests
        - package: FairspokenUpdates/FairspokenUpdateModelTests
    archive:
      config: Release
  FairspokenServer:
    build:
      targets:
        FairspokenServer: all
    run:
      config: Debug
      commandLineArguments:
        "--show-window": true
    test:
      config: Debug
      targets:
        - package: FairspokenHost/FairspokenHostTests
        - package: FairspokenUpdates/FairspokenUpdateModelTests
    archive:
      config: Release
