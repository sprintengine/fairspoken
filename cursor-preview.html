<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictation preview</title>
    <script type="module" src="/src/cursorPreview.ts"></script>
  </head>
  <body>
    <aside id="cursorPreview" class="ds-popover cursor-preview" aria-label="Live dictation preview" hidden>
      <svg id="previewPolishMark" class="cursor-preview-polish-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M14.5 3.6a2.1 2.1 0 0 1 3 3L11 13.1l-3.6.6.6-3.6 6.5-6.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M6.6 15.2c1.6-.5 3 .3 3 2 0 1.6-1.2 2.6-2.8 2.9-1.4.2-3-.1-4.1-.5 1.1-.5 1.4-1.2 1.6-2.2.2-1.1.8-1.9 2.3-2.2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <div id="previewText" class="cursor-preview-text" role="region" aria-label="Dictation text"></div>
      <span id="previewAnnouncement" class="cursor-preview-announcement" role="status" aria-live="polite" aria-atomic="true"></span>
    </aside>
  </body>
</html>
