<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictation preview</title>
    <script type="module" src="/src/cursorPreview.ts"></script>
  </head>
  <body>
    <aside id="cursorPreview" class="ds-popover cursor-preview" aria-label="Live dictation preview" hidden>
      <div id="previewText" class="cursor-preview-text" role="region" aria-label="Dictation text"></div>
      <span id="previewAnnouncement" class="cursor-preview-announcement" role="status" aria-live="polite" aria-atomic="true"></span>
    </aside>
  </body>
</html>
