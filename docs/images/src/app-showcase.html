<!doctype html>
<!-- App showcase: the REAL app windows composed over the shared backdrop.
     Must be served by Vite from the repo root (render.mjs does this) so the
     iframes load the real home.html / index.html / cursor-preview.html with
     the real CSS; tauri-stub.js is injected into every frame by render.mjs.
       /docs/images/src/app-showcase.html?theme=light|dark
     Product name: comes from the app source (home.html "… Cloud" option); this
     file contains none. render.mjs can preview a rename with PRODUCT_NAME=… . -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>App showcase</title>
<link rel="stylesheet" href="showcase.css">
<style>
  .canvas { --w: 1440px; --h: 880px; }

  /* Settings window (real home.html). Its transparent macOS titlebar is part
     of the page, so only the traffic lights are drawn here. */
  .app { left: 520px; top: 44px; width: 872px; height: 600px; }
  .app iframe { height: 100%; }
  .app .lights { position: absolute; left: 18px; top: 17px; z-index: 2; }

  /* A plain document editor: the app being dictated into. */
  .editor { left: 48px; top: 312px; width: 724px; height: 478px; background: var(--ed-bg); border: 1px solid var(--ed-edge); }
  .ed-bar { height: 40px; display: flex; align-items: center; padding: 0 16px; background: var(--ed-bar); border-bottom: 1px solid var(--ed-edge); position: relative; }
  .ed-title { position: absolute; left: 0; right: 0; text-align: center; font: 600 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; color: var(--ed-muted); letter-spacing: -0.01em; pointer-events: none; }
  .doc { padding: 26px 40px 0; font: 15px/1.62 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; color: var(--ed-text); letter-spacing: -0.006em; }
  .doc h1 { font-size: 21px; line-height: 1.25; font-weight: 650; letter-spacing: -0.02em; color: var(--ed-strong); }
  .doc .when { margin: 4px 0 18px; font-size: 13px; color: var(--ed-muted); }
  .doc p { margin: 0 0 10px; }
  .doc b { font-weight: 600; color: var(--ed-strong); }
  .caret { display: inline-block; width: 2px; height: 1.15em; margin: 0 0 -0.2em 1px; background: var(--ed-caret); border-radius: 1px; }

  :root { --ed-bg: #ffffff; --ed-bar: #f6f6f7; --ed-edge: rgba(0,0,0,0.08); --ed-text: #3a3f45; --ed-strong: #1d2125; --ed-muted: #80868f; --ed-caret: #2b6cd4; }
  [data-theme="dark"] { --ed-bg: #1c1d21; --ed-bar: #232428; --ed-edge: rgba(255,255,255,0.08); --ed-text: #c9cbd1; --ed-strong: #f1f1f3; --ed-muted: #8b8e96; --ed-caret: #5ea0f2; }

  /* Live cursor preview (real cursor-preview.html) + the glass the native
     NSGlassEffectView supplies behind it in the app. */
  #previewGlass { position: absolute; border-radius: 12px; -webkit-backdrop-filter: blur(16px) saturate(1.1); backdrop-filter: blur(16px) saturate(1.1); }
  #preview { position: absolute; width: 464px; border: 0; background: transparent; }

  /* Recording pill (real index.html), bottom-centre like on screen. */
  /* Frames are oversized by PAD so the real drop shadows are not clipped;
     the capsule/popover keep their shipped sizes (186×46 and 400pt windows). */
  #pill { position: absolute; left: calc(50% - 133px); bottom: -26px; width: 266px; height: 126px; border: 0; background: transparent; }
</style>
</head>
<body>
  <div class="canvas" id="shot">
    <div class="window app">
      <span class="lights"><i></i><i></i><i></i></span>
      <iframe id="home" src="/home.html" title="Settings window"></iframe>
    </div>

    <div class="window editor" id="editor">
      <div class="ed-bar"><span class="lights"><i></i><i></i><i></i></span><span class="ed-title">Consultation notes</span></div>
      <div class="doc">
        <h1>Cough, two weeks</h1>
        <div class="when">Monday 5 October · 10:24 · Consult Room 2</div>
        <p><b>History.</b> Dry cough for two weeks, worse at night. No fever, haemoptysis or weight loss. Non-smoker.</p>
        <p><b>Examination.</b> Chest clear, sats 98% on air, temperature 36.8°C. Throat mildly erythematous.</p>
        <p><b>Plan.</b> <span class="caret" id="caret"></span></p>
      </div>
    </div>

    <div id="previewGlass"></div>
    <iframe id="preview" src="/cursor-preview.html" title="Live dictation preview"></iframe>
    <iframe id="pill" src="/index.html" title="Recording pill"></iframe>
  </div>

<script type="module">
  const params = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = params.get("theme") || "light";

  const loaded = (frame) => new Promise((ok) => {
    if (frame.contentDocument?.readyState === "complete" && frame.contentWindow.location.href !== "about:blank") ok();
    else frame.addEventListener("load", () => ok(), { once: true });
  });
  const wait = (ms) => new Promise((ok) => setTimeout(ok, ms));
  const until = async (fn, ms = 5000) => { const end = Date.now() + ms; while (!fn()) { if (Date.now() > end) throw new Error("timeout"); await wait(30); } };

  // Dictation in flight: the raw ASR text, then the local polish pass that
  // rewrites it. The preview shows the polish diff exactly as the app does.
  const RAW = "Likely post-viral cough, um, so advised honey and warm fluids. Safety-netted for fever or breathlessness, and review in three weeks if not settling";
  const POLISHED = "Likely post-viral cough. Advised honey and warm fluids. Safety-netted for fever or breathlessness, and review in three weeks if not settling";

  async function stageSettings() {
    const frame = document.getElementById("home");
    await loaded(frame);
    const doc = frame.contentDocument;
    await until(() => doc.querySelector('[data-screen="settings"]') && frame.contentWindow.__TAURI_INTERNALS__);
    doc.querySelector('[data-screen="settings"]').click();
    doc.querySelector('[data-settings-category="transcription"]').click();
    const select = doc.getElementById("modelSelect");
    await until(() => select.options.length > 2 && doc.getElementById("modelField").offsetParent);
    await wait(250);
    // The shipped .w-md (168px) truncates "Parakeet TDT 0.6B v3"; widen it
    // just enough for the label (see report: suggested app fix).
    select.style.width = "188px";
    await wait(50);

    // Open the speech-model picker using the app's own listbox component
    // (src/design-system/select.css) — a native <select> popup can't be captured.
    const box = select.getBoundingClientRect();
    const list = doc.createElement("ul");
    list.className = "ds-select-listbox";
    list.setAttribute("role", "listbox");
    list.style.setProperty("--ds-select-top", `${box.bottom + 4}px`);
    list.style.setProperty("--ds-select-left", `${box.left}px`);
    list.style.setProperty("--ds-select-trigger-width", `${box.width}px`);
    list.style.animation = "none";
    for (const option of select.options) {
      const li = doc.createElement("li");
      li.className = "ds-select-option";
      if (option.value === "large-v3-turbo") li.classList.add("ds-select-option--active");
      li.setAttribute("aria-selected", String(option.selected));
      li.innerHTML = '<span class="ds-select-option-label"></span><svg class="ds-select-check" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2l2 2 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      li.firstChild.textContent = option.textContent;
      li.querySelector("svg").style.visibility = option.selected ? "visible" : "hidden";
      list.append(li);
    }
    doc.body.append(list);
    // Right-align to the trigger so the wider list stays inside the window.
    const width = list.getBoundingClientRect().width;
    list.style.setProperty("--ds-select-left", `${box.right + 20 - width}px`);
    select.classList.add("is-open");
    select.focus({ preventScroll: true });
  }

  async function stagePreview() {
    const frame = document.getElementById("preview");
    await loaded(frame);
    const win = frame.contentWindow, doc = frame.contentDocument;
    await until(() => win.__fsEmit && doc.getElementById("cursorPreview"));
    doc.body.style.padding = "48px"; // room for the real modal shadow
    await wait(200);
    const base = { sessionId: 7, phase: "recording", remote: false };
    win.__fsEmit("cursor-preview-state", { ...base, revision: 1, text: RAW, polished: false, polishing: true });
    await wait(60);
    win.__fsEmit("cursor-preview-state", { ...base, revision: 2, text: POLISHED, polished: true, polishing: true });
    await wait(120);

    // Anchor below-right of the caret, as cursor_preview.rs positions it
    // (8pt gap; the preview window carries 16px body padding).
    const caret = document.getElementById("caret").getBoundingClientRect();
    const canvas = document.getElementById("shot").getBoundingClientRect();
    const popover = doc.getElementById("cursorPreview").getBoundingClientRect();
    const left = caret.right - canvas.left + 8 - 48;
    const top = caret.bottom - canvas.top + 8 - 48;
    Object.assign(frame.style, { left: `${left}px`, top: `${top}px`, height: `${popover.height + 96}px` });
    Object.assign(document.getElementById("previewGlass").style, {
      left: `${left + 48}px`, top: `${top + 48}px`, width: `${popover.width}px`, height: `${popover.height}px`,
    });
  }

  async function stagePill() {
    const frame = document.getElementById("pill");
    await loaded(frame);
    const doc = frame.contentDocument;
    await until(() => doc.getElementById("recordBtn"));
    doc.body.dataset.pill = "recording";
    doc.querySelector(".window").style.padding = "0 46px 47px"; // 186×46 window + shadow room
    doc.getElementById("statusLabel").textContent = "Recording";
    doc.getElementById("timer").textContent = "0:14";
    const levels = [0.42, 0.78, 1, 0.64, 0.86];
    doc.querySelectorAll(".wave span").forEach((bar, i) => { bar.style.transform = `scaleY(${levels[i]})`; });
  }

  await Promise.all([stageSettings(), stagePreview(), stagePill()]);
  window.__ready = true;
</script>
</body>
</html>
