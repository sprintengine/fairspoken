# Per-pack adapter: Irish GP house style on top of the merged tagged model.
# Small on purpose: an adapter is a few MB and must not undo the base
# behaviour (restraint, no invented words).
model: models/fairspoken-polish-hf
train: true
fine_tune_type: lora
data: data/ie-general-practice
adapter_path: adapters/ie-general-practice
seed: 7
# Same layers and projections as base.yaml (see there).
num_layers: 8
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj",
         "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
  rank: 8
  scale: 2.0
  dropout: 0.05
# Memory-safe on a 16 GB Mac: batch 1 at 512 tokens keeps the 248k-entry
# vocabulary's logits small (batch 4 at 1,024 tokens reached 14 GB). train.py
# also caps MLX at --max-memory-gb (default 6) and aborts above it.
batch_size: 1
grad_accumulation_steps: 4
iters: 1500
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [1.0e-4, 1500, 1.0e-6]
mask_prompt: true
grad_checkpoint: true
max_seq_length: 512
steps_per_report: 25
steps_per_eval: 100
val_batches: 50
save_every: 100
