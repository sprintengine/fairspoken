<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multivoice host</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Multivoice host — the operator's portal for a standalone transcription
     server. Aligned to the client home window (src/home.css): one product
     accent, the 6px-dot status idiom (no glow), two radii, three weights, a
     fixed display/stat/body/meta/micro scale. Structure is carried by spacing
     + headings + a single hairline — never by stacked cards. */
  :root {
    --bg:            #0d0d0f;
    --bg-elevated:   #151517;
    --bg-row-hover:  #1b1b1f;
    --track:         #222226;

    --border:        rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.11);

    --text:          #ededee;
    --text-secondary:#9a9aa2;
    --text-muted:    #62626b;

    --accent:        #ff1a3d;
    --accent-quiet:  rgba(255,26,61,0.10);
    --dot-good:      #30d158;
    --dot-idle:      #62626b;
    --warning:       #ffa600;

    --fs-stat:       20px;
    --fs-title:      15px;
    --fs-body:       13px;
    --fs-meta:       12px;
    --fs-micro:      11px;

    --r:             8px;
    --r-sm:          6px;
    --gutter:        24px;

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --font-brand: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: var(--fs-body);
    line-height: 1.42;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums slashed-zero;
  }
  .num  { font-variant-numeric: tabular-nums slashed-zero; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums slashed-zero; }

  /* ── Topbar — wordmark (brand continuity) left, connection status right. ── */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    height: 48px; padding: 0 var(--gutter);
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex; align-items: baseline; gap: 8px;
    font-family: var(--font-brand);
  }
  .brand-name { font-size: var(--fs-title); font-weight: 600; letter-spacing: -0.02em; color: var(--text); }
  .brand-host { font-size: var(--fs-meta); font-weight: 500; color: var(--text-muted); }

  .conn { margin-left: auto; display: flex; align-items: center; gap: 7px; }
  .conn-dot {
    width: 6px; height: 6px; border-radius: 50%; flex: none;
    background: var(--dot-idle);
    transition: background 160ms ease;
  }
  .conn-label { font-size: var(--fs-meta); color: var(--text-secondary); }
  .conn[data-state="live"]         .conn-dot { background: var(--dot-good); }
  .conn[data-state="offline"]      .conn-dot { background: var(--warning); }
  .conn[data-state="unauthorized"] .conn-dot { background: var(--accent); }

  /* ── Page column ── */
  .page {
    max-width: 860px; margin: 0 auto;
    padding: 22px var(--gutter) 64px;
  }

  /* Identity line — which host you're looking at (source of truth). */
  .ident {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    color: var(--text-secondary); font-size: var(--fs-meta);
    padding-bottom: 22px;
  }
  .ident code { font-family: var(--mono); font-size: var(--fs-meta); color: var(--text); }
  .ident .sep { color: var(--text-muted); }
  .ident #uptime { color: var(--text); }

  /* ── Stat strip — flat columns split by a single vertical hairline. ── */
  .stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-bottom: 30px; }
  .stat { padding: 0 18px; border-left: 1px solid var(--border); }
  .stat:first-child { padding-left: 0; border-left: none; }
  .stat-label { display: flex; align-items: center; gap: 7px; color: var(--text-secondary); font-size: var(--fs-meta); }
  .stat-dot {
    width: 6px; height: 6px; border-radius: 50%; flex: none;
    background: transparent; transition: background 160ms ease;
  }
  .stat-dot[data-active="true"] { background: var(--accent); }
  .stat-value { font-size: var(--fs-stat); font-weight: 600; letter-spacing: -0.01em; margin-top: 4px; }
  .stat-value[data-active="true"] { color: var(--accent); }
  .stat-value .unit { font-size: var(--fs-body); font-weight: 500; color: var(--text-muted); margin-left: 1px; }
  .stat-meta { color: var(--text-muted); font-size: var(--fs-micro); margin-top: 4px; min-height: 14px; }
  .stat-meta[data-active="true"] { color: var(--accent); }

  @media (max-width: 560px) {
    .stats { grid-template-columns: 1fr; gap: 14px; }
    .stat { padding: 0; border-left: none; }
  }

  /* ── Recent panel — heading + hairline-separated rows, no card. ── */
  .panel-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 6px; }
  .panel-head h2 { font-size: var(--fs-body); font-weight: 600; color: var(--text); }
  .panel-head .grow { flex: 1; }
  .panel-head .count { font-family: var(--mono); font-size: var(--fs-micro); color: var(--text-muted); }

  .rows { display: flex; flex-direction: column; }
  .row {
    display: grid;
    grid-template-columns: 72px 52px minmax(0, 1fr) 112px;
    align-items: baseline; gap: 14px;
    padding: 9px 0; border-top: 1px solid var(--border);
  }
  .row:first-child { border-top: none; }
  .row.fresh { animation: fresh 1.2s ease-out 1; }
  @keyframes fresh { 0% { background: var(--accent-quiet); } 100% { background: transparent; } }

  .row-time     { font-family: var(--mono); font-size: var(--fs-micro); color: var(--text-secondary); }
  .row-source   { font-family: var(--mono); font-size: var(--fs-micro); color: var(--text-muted); }
  .row-model    { font-family: var(--mono); font-size: var(--fs-meta); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-model .sep { color: var(--text-muted); margin: 0 4px; }
  .row-duration { font-family: var(--mono); font-size: var(--fs-meta); color: var(--text-secondary); text-align: right; white-space: nowrap; }

  .placeholder { padding: 14px 0 4px; color: var(--text-muted); font-size: var(--fs-meta); }

  /* Inline notice — recovery copy for states that need an operator action. */
  .notice {
    display: none; margin-top: 18px;
    padding: 11px 13px; border-radius: var(--r-sm);
    background: var(--accent-quiet); border: 1px solid rgba(255,26,61,0.18);
    color: var(--text); font-size: var(--fs-meta);
  }
  .notice[data-visible="true"] { display: block; }
  .notice code { font-family: var(--mono); font-size: var(--fs-micro); color: var(--text-secondary); }

  @media (prefers-reduced-motion: reduce) {
    .row.fresh { animation: none; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <span class="brand">
      <span class="brand-name">multivoice</span>
      <span class="brand-host">host</span>
    </span>
    <span class="conn" id="conn" data-state="connecting">
      <span class="conn-dot" aria-hidden="true"></span>
      <span class="conn-label" id="connLabel" role="status" aria-live="polite">Connecting…</span>
    </span>
  </header>

  <main class="page">
    <section class="ident" aria-label="Host identity">
      <code id="bindAddr">—</code>
      <span class="sep">·</span>
      <span id="version">—</span>
      <span class="sep">·</span>
      <span>up <span id="uptime">—</span></span>
    </section>

    <section class="stats" aria-label="Live metrics">
      <div class="stat" role="group" aria-labelledby="activeLabel">
        <div class="stat-label" id="activeLabel">
          <span class="stat-dot" id="activeDot" aria-hidden="true"></span>
          <span>Streams</span>
        </div>
        <div class="stat-value" id="activeValue">0</div>
        <div class="stat-meta" id="activeMeta">active</div>
      </div>
      <div class="stat" role="group" aria-labelledby="queuedLabel">
        <div class="stat-label" id="queuedLabel">Queued</div>
        <div class="stat-value" id="queuedValue">0</div>
        <div class="stat-meta" id="queuedMeta">waiting</div>
      </div>
      <div class="stat" role="group" aria-labelledby="runningLabel">
        <div class="stat-label" id="runningLabel">Running</div>
        <div class="stat-value" id="runningValue">0</div>
        <div class="stat-meta" id="runningMeta">workers</div>
      </div>
      <div class="stat" role="group" aria-labelledby="totalLabel">
        <div class="stat-label" id="totalLabel">Transcriptions</div>
        <div class="stat-value" id="totalValue">0</div>
        <div class="stat-meta">lifetime</div>
      </div>
      <div class="stat" role="group" aria-labelledby="audioLabel">
        <div class="stat-label" id="audioLabel">Audio processed</div>
        <div class="stat-value" id="audioValue">0<span class="unit">s</span></div>
        <div class="stat-meta">lifetime</div>
      </div>
      <div class="stat" role="group" aria-labelledby="healthLabel">
        <div class="stat-label" id="healthLabel">Rejected</div>
        <div class="stat-value" id="rejectedValue">0</div>
        <div class="stat-meta" id="healthMeta">0 failed</div>
      </div>
    </section>

    <section class="panel" aria-label="Recent transcriptions">
      <div class="panel-head">
        <h2>Recent transcriptions</h2>
        <span class="grow"></span>
        <span class="count" id="recentCount">0</span>
      </div>
      <div class="rows" id="recentList" role="list">
        <p class="placeholder" id="placeholder">Connecting to host…</p>
      </div>
    </section>

    <div class="notice" id="notice" role="status" aria-live="polite">
      <span id="noticeMessage"></span>
    </div>
  </main>

<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token") || "";

  const el = {
    conn:        document.getElementById("conn"),
    connLabel:   document.getElementById("connLabel"),
    bindAddr:    document.getElementById("bindAddr"),
    version:     document.getElementById("version"),
    uptime:      document.getElementById("uptime"),
    activeDot:   document.getElementById("activeDot"),
    activeValue: document.getElementById("activeValue"),
    activeMeta:  document.getElementById("activeMeta"),
    queuedValue: document.getElementById("queuedValue"),
    queuedMeta:  document.getElementById("queuedMeta"),
    runningValue:document.getElementById("runningValue"),
    runningMeta: document.getElementById("runningMeta"),
    totalValue:  document.getElementById("totalValue"),
    audioValue:  document.getElementById("audioValue"),
    rejectedValue: document.getElementById("rejectedValue"),
    healthMeta:  document.getElementById("healthMeta"),
    recentCount: document.getElementById("recentCount"),
    recentList:  document.getElementById("recentList"),
    placeholder: document.getElementById("placeholder"),
    notice:      document.getElementById("notice"),
    noticeMsg:   document.getElementById("noticeMessage"),
  };

  let seenIds = new Set();
  let loadedOnce = false;
  let connState = "";

  const pad2 = n => String(n).padStart(2, "0");

  const formatUptime = (totalSeconds) => {
    const s = Math.max(0, Math.floor(totalSeconds));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}h ${pad2(m)}m`;
    if (m > 0) return `${m}m ${pad2(sec)}s`;
    return `${sec}s`;
  };

  const formatTotalAudio = (totalSeconds) => {
    const s = Math.max(0, totalSeconds);
    if (s >= 3600) {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      return { value: `${h}h ${pad2(m)}m`, unit: "" };
    }
    if (s >= 60) {
      const m = Math.floor(s / 60);
      const sec = Math.round(s % 60);
      return { value: `${m}m ${pad2(sec)}s`, unit: "" };
    }
    return { value: s.toFixed(1), unit: "s" };
  };

  const formatDuration = (sec) => {
    const s = Math.max(0, sec);
    if (s >= 60) {
      const m = Math.floor(s / 60);
      const r = (s - m * 60).toFixed(1);
      return `${m}m ${r}s`;
    }
    return `${s.toFixed(1)}s`;
  };

  const formatMillis = (ms) => {
    const value = Math.max(0, Math.round(ms));
    if (value >= 1000) return `${(value / 1000).toFixed(1)}s`;
    return `${value}ms`;
  };

  const formatClock = (ms) => {
    if (!ms) return "—";
    const d = new Date(ms);
    return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  };

  // Connection state drives the single status indicator. Recovery copy that
  // needs an operator action lives in the inline notice; the topbar label is
  // the short canonical state, so the two never restate the same value.
  const setConnection = (state, label) => {
    if (state !== connState) {
      el.conn.setAttribute("data-state", state);
      el.connLabel.textContent = label;
      connState = state;
    }
    const showNotice = state === "unauthorized";
    el.notice.setAttribute("data-visible", showNotice ? "true" : "false");
    if (state === "unauthorized") {
      el.noticeMsg.innerHTML =
        'Unauthorized. Append <code>?token=…</code> to the URL with the host token.';
    }
  };

  const renderRecent = (records) => {
    if (!records || records.length === 0) {
      el.recentList.innerHTML = "";
      el.placeholder.textContent = "No transcriptions yet.";
      el.recentList.appendChild(el.placeholder);
      el.recentCount.textContent = "0";
      seenIds = new Set();
      return;
    }
    el.recentCount.textContent = String(records.length);

    const frag = document.createDocumentFragment();
    const nextSeen = new Set();
    for (const r of records) {
      nextSeen.add(r.id);
      const isFresh = loadedOnce && !seenIds.has(r.id);
      const row = document.createElement("div");
      row.className = "row" + (isFresh ? " fresh" : "");
      row.setAttribute("role", "listitem");

      const time = document.createElement("span");
      time.className = "row-time";
      time.textContent = formatClock(r.completedAtMs);

      const source = document.createElement("span");
      source.className = "row-source";
      source.textContent = r.source || "—";

      const model = document.createElement("span");
      model.className = "row-model";
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "·";
      model.appendChild(document.createTextNode(r.backend || "—"));
      model.appendChild(sep);
      model.appendChild(document.createTextNode(r.model || "—"));

      const duration = document.createElement("span");
      duration.className = "row-duration";
      duration.textContent = [
        formatDuration(r.durationSeconds || 0),
        `q ${formatMillis(r.queueWaitMs || 0)}`,
        `p ${formatMillis(r.processingMs || 0)}`,
      ].join(" · ");

      row.append(time, source, model, duration);
      frag.appendChild(row);
    }

    el.recentList.innerHTML = "";
    el.recentList.appendChild(frag);
    seenIds = nextSeen;
  };

  const apply = (stats) => {
    el.bindAddr.textContent = stats.bindAddr || "—";
    el.version.textContent = stats.serverVersion ? `v${stats.serverVersion}` : "—";
    el.uptime.textContent = formatUptime(stats.uptimeSeconds || 0);

    const streams = stats.activeStreams ?? stats.activeSessions ?? 0;
    const queued = stats.queuedJobs || 0;
    const running = stats.runningJobs || 0;
    const workers = stats.workerCount || 0;
    const capacity = stats.queueCapacity || 0;
    const maxStreams = stats.maxActiveStreams || 0;
    const rejected = stats.rejectedJobs || 0;
    const failed = stats.failedJobs || 0;
    const averageQueue = stats.averageQueueMs || 0;
    const averageProcessing = stats.averageProcessingMs || 0;
    const live = streams > 0 || queued > 0 || running > 0;

    el.activeValue.textContent = String(streams);
    el.activeValue.setAttribute("data-active", streams > 0 ? "true" : "false");
    el.activeDot.setAttribute("data-active", live ? "true" : "false");
    el.activeMeta.textContent = maxStreams ? `limit ${maxStreams}` : "active";

    el.queuedValue.textContent = String(queued);
    el.queuedValue.setAttribute("data-active", queued > 0 ? "true" : "false");
    el.queuedMeta.textContent = capacity
      ? `capacity ${capacity} · avg ${formatMillis(averageQueue)}`
      : `avg ${formatMillis(averageQueue)}`;

    el.runningValue.textContent = String(running);
    el.runningValue.setAttribute("data-active", running > 0 ? "true" : "false");
    el.runningMeta.textContent = `${workers === 1 ? "1 worker" : `${workers} workers`} · avg ${formatMillis(averageProcessing)}`;

    el.rejectedValue.textContent = String(rejected);
    el.rejectedValue.setAttribute("data-active", rejected > 0 ? "true" : "false");
    el.healthMeta.textContent = `${failed} failed`;
    el.healthMeta.setAttribute("data-active", failed > 0 ? "true" : "false");

    el.totalValue.textContent = String(stats.totalTranscriptions || 0);

    const audio = formatTotalAudio(stats.totalAudioSeconds || 0);
    el.audioValue.innerHTML = "";
    el.audioValue.appendChild(document.createTextNode(audio.value));
    if (audio.unit) {
      const u = document.createElement("span");
      u.className = "unit";
      u.textContent = audio.unit;
      el.audioValue.appendChild(u);
    }

    renderRecent(stats.recent || []);
    loadedOnce = true;
  };

  const fetchStats = async () => {
    try {
      const headers = {};
      if (token) headers["Authorization"] = `Bearer ${token}`;
      const res = await fetch("/v1/stats", { headers, cache: "no-store" });
      if (res.status === 401) {
        setConnection("unauthorized", "Unauthorized");
        return;
      }
      if (!res.ok) {
        setConnection("offline", `Host error ${res.status}`);
        return;
      }
      const data = await res.json();
      setConnection("live", "Live");
      apply(data);
    } catch {
      setConnection("offline", "Reconnecting…");
    }
  };

  fetchStats();
  setInterval(fetchStats, 2000);
})();
</script>
</body>
</html>
