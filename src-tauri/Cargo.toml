[package]
name = "multivoice-tauri"
version = "0.1.0"
description = "Lightweight Tauri/Rust rebuild of Multivoice desktop dictation"
authors = ["Multicode Labs"]
edition = "2021"
default-run = "multivoice-tauri"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "multivoice_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.17.3"
whisper-rs = "0.16.0"
arboard = "3.6.1"
sha1 = "0.11.0"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "rustls", "json"] }
tauri-plugin-global-shortcut = "2"
sherpa-onnx = { version = "1.13.0", default-features = false, features = ["shared"] }
tar = "0.4.44"
bzip2 = "0.6.0"
hound = "3.5.1"
tiny_http = "0.12.0"
