[package]
name = "fairspoken"
version = "0.1.0"
description = "Fast, private, local-first desktop dictation"
authors = ["SprintEngine"]
license = "MIT"
repository = "https://github.com/sprintengine/fairspoken"
edition = "2021"
default-run = "fairspoken"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fairspoken_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.17.3"
# Parakeet remains the default model. Both speech engines ship by default.
# It runs NVIDIA
# Parakeet TDT in-process via ONNX Runtime (pulled in transitively as the `ort`
# crate), mirroring how `whisper-rs` wraps whisper.cpp.
parakeet-rs = "0.3.6"
# Whisper ships by default. `--no-default-features` produces a smaller
# Parakeet-only build without the whisper.cpp/GGML toolchain.
whisper-rs = { version = "0.16.0", optional = true }
arboard = "3.6.1"
sha1 = "0.11.0"
sha2 = "0.11.0"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "rustls", "json"] }
tauri-plugin-global-shortcut = "2"
hound = "3.5.1"
tiny_http = "0.12.0"
# The transcription host's listener, built with TCP keepalive (already in the
# tree through tokio and hyper-util); "all" adds the keepalive retry count.
socket2 = { version = "0.6", features = ["all"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Standalone transcription host self-update: verify the archive's minisign
# signature (the same key as the desktop updater), compare versions, and
# swap the running executable (which needs special handling on Windows).
minisign-verify = "0.2"
base64 = "0.22"
# Host tokens generated for pairing (already in the tree via uuid).
getrandom = "0.4"
semver = "1"
self-replace = "1"
# Double Metaphone keys for vocabulary pack retrieval (a port of Apache
# commons-codec). Default features embed Beider-Morse/Daitch-Mokotoff rule
# files the app does not use.
rphonetic = { version = "4", default-features = false }

[dev-dependencies]
# Host self-update tests sign throwaway archives with a generated keypair.
minisign = "0.7"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
core-foundation = "0.10.1"
# Frontmost-app identity for the AI polish pipeline (NSWorkspace — no extra
# macOS permission required).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }

# Metal stays macOS-only and only matters when Whisper is compiled in: the
# feature builds GGML Metal kernels that do not exist on Windows/Linux. It is
# layered onto the optional whisper-rs dependency for macOS targets so a
# `--features whisper` build there gets GPU inference.
[target.'cfg(target_os = "macos")'.dependencies.whisper-rs]
version = "0.16.0"
features = ["metal"]
optional = true

[features]
# Ship both selectable speech families; the selected default stays Parakeet.
default = ["whisper"]
# Compile the whisper.cpp engine and Whisper model family.
whisper = ["dep:whisper-rs"]
# GPU backends for the (optional) Whisper engine on a non-Mac transcription
# host. Build-time choices: `cuda` needs the NVIDIA CUDA Toolkit on the build
# machine and CUDA runtime libraries on the target; `vulkan` is the
# vendor-neutral option. Both imply the whisper feature.
cuda = ["whisper", "whisper-rs/cuda"]
vulkan = ["whisper", "whisper-rs/vulkan"]

[patch.crates-io]
# tiny_http 0.12.0 (MIT OR Apache-2.0) with one patch, in
# vendor/tiny_http/src/util/equal_reader.rs: an unread request body is
# drained through a fixed 8 KiB buffer (up to 16 MiB) instead of a buffer of
# whatever length the client claimed, which let one unauthenticated request
# with a huge Content-Length crash or abort the transcription host. Only
# src/, Cargo.toml, the licences and the README were copied. Drop this once
# upstream drains without allocating the claimed length.
tiny_http = { path = "vendor/tiny_http" }
