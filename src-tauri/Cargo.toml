[package]
name = "multivoice-tauri"
version = "0.1.0"
description = "Lightweight Tauri/Rust rebuild of Multivoice desktop dictation"
authors = ["Multicode Labs"]
edition = "2021"
default-run = "multivoice-tauri"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "multivoice_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.17.3"
whisper-rs = "0.16.0"
arboard = "3.6.1"
sha1 = "0.11.0"
sha2 = "0.11.0"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "rustls", "json"] }
tauri-plugin-global-shortcut = "2"
hound = "3.5.1"
tiny_http = "0.12.0"

# Metal stays macOS-only: the feature compiles GGML Metal kernels that do not
# exist on Windows/Linux. Cargo merges these features into the base whisper-rs
# dependency for macOS targets, so both the desktop app and the
# transcription-host binary get GPU inference.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
core-graphics = "0.25.0"
core-foundation = "0.10.1"

# Opt-in GPU backends for a future non-Mac transcription host. These are
# build-time choices: `cuda` needs the NVIDIA CUDA Toolkit on the build
# machine and CUDA runtime libraries on the target; `vulkan` is the
# vendor-neutral option. Neither has been exercised yet — no non-Mac GPU
# host hardware exists; validate on real hardware before relying on them.
[features]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
