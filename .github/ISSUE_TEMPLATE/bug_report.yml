name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't include recordings or transcripts that contain private information.
        Security issues: use the private "Report a vulnerability" form instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open settings
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fairspoken version or commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 15.5 (Apple Silicon)
    validations:
      required: true
  - type: dropdown
    id: location
    attributes:
      label: Transcription location
      options:
        - Local
        - Remote host
        - Fairspoken Cloud
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
