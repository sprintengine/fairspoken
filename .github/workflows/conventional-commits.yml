name: Conventional Commits

# Pull requests are squash-merged with the PR title as the commit subject, and
# that subject decides the next version (scripts/release/main-release.mjs), so
# the title is checked here before it can land.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: conventional-commits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The event file is data: never interpolate a PR title into shell code.
      - run: node scripts/release/check-pr-title.mjs
