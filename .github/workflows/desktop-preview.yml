name: Desktop macOS Preview

# Label a pull request `preview:mac` to get an unsigned Apple Silicon DMG of it,
# linked from a comment on the pull request. Every push to a labelled pull
# request rebuilds it. The DMG is a workflow artifact, kept seven days, so it
# never touches the releases or the updater.
on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

# A push supersedes the build in flight. Adding some other label must not
# cancel it, so only a preview:mac label event (or a push) counts.
concurrency:
  group: desktop-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'labeled' || github.event.label.name == 'preview:mac' }}

jobs:
  # Runs pull request code, so it keeps a read-only token; the comment is posted
  # by the job below, which never checks the code out. Pull requests from forks
  # are refused: their token cannot comment.
  build:
    name: Build macOS Apple Silicon preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:mac') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:mac')
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      product: ${{ steps.version.outputs.product }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: preview-darwin-aarch64

      - name: Install dependencies
        run: npm ci

      # A preview version is a prerelease that is not on the nightly train, so
      # the build follows stable if it ever checks for updates.
      - name: Stamp the preview version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version.replace(/-.*/, '')")-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          node scripts/release/release.mjs stamp "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "product=$(node -p "require('./src-tauri/tauri.conf.json').productName")" >> "$GITHUB_OUTPUT"

      # Ad-hoc signed on purpose: no signing secrets reach pull request code.
      # No updater artifacts either, so the updater key is not needed.
      - name: Package unsigned DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --bundles dmg

      - name: Upload DMG
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.product }}-${{ steps.version.outputs.version }}-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  comment:
    name: Link the preview
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the preview comment
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
          VERSION: ${{ needs.build.outputs.version }}
          PRODUCT: ${{ needs.build.outputs.product }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- desktop-macos-preview -->'
            const body = [
              marker,
              '### macOS preview',
              '',
              `[Download the Apple Silicon DMG](${process.env.ARTIFACT_URL}) (zipped; kept 7 days)`,
              '',
              `Version: ${process.env.VERSION}`,
              `Commit: ${process.env.HEAD_SHA.slice(0, 7)}`,
              '',
              'Unsigned build. Clear quarantine before opening:',
              '```sh',
              `xattr -dr com.apple.quarantine "/Applications/${process.env.PRODUCT}.app"`,
              '```',
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            // Only a comment this workflow posted is ours to edit: anyone can paste
            // the marker into a comment, and updating theirs would fail (or, for a
            // maintainer's, rewrite it), leaving no preview comment at all.
            const existing = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
