name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build & test
    # ubuntu-24.04 (glibc 2.39) is required: the prebuilt ONNX Runtime that
    # `ort` downloads is built against glibc >= 2.38 (it references the C23
    # `__isoc23_strtoll` family), which ubuntu-22.04's glibc 2.35 cannot link.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config cmake clang

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Build backend (default — Parakeet)
        run: cargo build --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Test backend (default — Parakeet)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Compile-check Whisper feature
        run: cargo build --manifest-path src-tauri/Cargo.toml --features whisper
