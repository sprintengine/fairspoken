name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Windows native dependencies
        shell: pwsh
        run: |
          choco install llvm cmake -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: Multivoice Tauri v__VERSION__
          releaseBody: Download the Windows installer from the assets below.
          releaseDraft: true
          prerelease: false
