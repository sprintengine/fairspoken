name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish artifacts to a GitHub Release"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v${TAG} does not match package.json version ${VERSION}" >&2
            exit 1
          fi

      - name: Decide publish mode
        id: publish
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
            args: ""
            rustTargets: ""
            artifactName: multivoice-tauri-windows
            hostBinary: src-tauri/target/release/transcription-host.exe
            hostAsset: multivoice-tauri-transcription-host-windows.zip
          - name: macos-x64
            os: macos-15-intel
            args: "--target x86_64-apple-darwin"
            rustTargets: "x86_64-apple-darwin"
            artifactName: multivoice-tauri-macos-x64
            hostBinary: src-tauri/target/x86_64-apple-darwin/release/transcription-host
            hostAsset: multivoice-tauri-transcription-host-macos-x64.zip
          - name: macos-arm64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rustTargets: "aarch64-apple-darwin"
            artifactName: multivoice-tauri-macos-arm64
            hostBinary: src-tauri/target/aarch64-apple-darwin/release/transcription-host
            hostAsset: multivoice-tauri-transcription-host-macos-arm64.zip
          - name: linux
            os: ubuntu-22.04
            args: ""
            rustTargets: ""
            artifactName: multivoice-tauri-linux
            hostBinary: src-tauri/target/release/transcription-host
            hostAsset: multivoice-tauri-transcription-host-linux.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm cmake -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config rpm cmake clang libfuse2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release assets
        if: needs.validate.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: Multivoice Tauri v__VERSION__
          releaseBody: Download the installer for your platform from the assets below.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build workflow artifacts
        if: needs.validate.outputs.publish != 'true'
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          args: ${{ matrix.args }}

      - name: Build transcription host
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin transcription-host --release ${{ matrix.args }}

      - name: Package transcription host
        id: package-host
        shell: pwsh
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP "multivoice-tauri-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $binary = "${{ matrix.hostBinary }}"
          if (-not (Test-Path $binary)) {
            throw "Expected transcription host binary not found: $binary"
          }
          $staged = Join-Path $assetDir (Split-Path -Leaf $binary)
          Copy-Item $binary $staged -Force
          $archive = Join-Path $assetDir "${{ matrix.hostAsset }}"
          Compress-Archive -Path $staged -DestinationPath $archive -Force
          "host_archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload transcription host release asset
        if: needs.validate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Multivoice Tauri v${{ needs.validate.outputs.version }}
          body: Download the installer for your platform from the assets below.
          draft: true
          prerelease: false
          files: ${{ steps.package-host.outputs.host_archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload packaged artifacts
        if: needs.validate.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}-${{ needs.validate.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/**/*
            ${{ steps.package-host.outputs.host_archive }}
