name: Release

# Main feeds a nightly train; stable is a promotion of what a nightly already
# shipped. docs/releasing.md walks through each entry point:
#
#   schedule                    every 30 minutes, a nightly of main's head, but
#                               only when the last nightly is 6+ hours old AND
#                               main has commits it did not ship AND no
#                               scheduled nightly of the same commit failed in
#                               the last 6 hours (scripts/release/nightly-gate.mjs).
#                               A tick whose main is behind or diverged from the
#                               last nightly's commit (history rewritten) FAILS
#                               in the resolve step rather than skipping quietly.
#   dispatch nightly            a nightly of main's head now, gate skipped
#   dispatch stable             promote: rebuild the commit the latest nightly
#                               shipped, as stable X.Y.Z, and tag it -- so stable
#                               only ever ships a build nightly users have run
#   dispatch feeds              build nothing; re-render the update feeds from
#                               the releases that exist (recovery, first setup)
#   push a tag vX.Y.Z           stable build of exactly the tagged commit (hotfix)
#
# A merge to main publishes nothing; CI (ci.yml) gates it as before.
#
# Nightlies are vX.Y.Z-nightly.YYYYMMDD.RUN, where X.Y.Z is the version the next
# stable would take (Conventional Commits since the last stable tag), published
# as prereleases that are never marked latest. Stables are X.Y.Z, marked latest.
# Every product of one release shares one build number, the UTC minute the
# release was resolved (YYYYMMDDHHMM): the macOS apps' CFBundleVersion, which
# Sparkle compares.
#
# Installed apps never read a release directly. Every feed they read lives on
# one rolling prerelease, `update-feeds` (never latest, never pruned):
# desktop-{stable,nightly}.json, appcast-fairspoken.xml,
# appcast-fairspoken-server.xml and host-{stable,nightly}.json. The feeds job
# RE-RENDERS all of them after every publish from the releases that exist and
# the small metadata each release carries (desktop-manifest.json,
# host-manifest.json, sparkle-<app>.json), so nothing points at a deleted asset.
#
# Build jobs publish NOTHING. They hand their files and their share of the
# metadata to one publish job, which merges it, uploads everything to a draft
# and only then makes the release visible, so a failed leg never leaves a
# public half-release behind it.
#
# Every release carries every product, built from one commit at one version:
#
#   package     the Tauri desktop app (Windows x64, Linux x64) and, on the same
#               runner and target dir, the standalone transcription host
#               (Windows x64, Linux x64/arm64, macOS arm64/x64). The
#               linux-arm64 and both macOS legs build only the host.
#   macos-app   the native macOS apps in apps/macos (Apple Silicon, macOS 26):
#               Fairspoken, the dictation client, and Fairspoken Server, the
#               transcription server, each with its Sparkle metadata
on:
  push:
    tags:
      - "v*"
  schedule:
    # Minutes 7 and 37, off the top of the hour when scheduled runs queue
    # longest. Most ticks end in the resolve step, which decides in seconds that
    # the gate is shut; only a tick that passes it spends the packaging legs.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "nightly builds main now; stable promotes the commit the latest nightly shipped; feeds only re-renders the update feeds"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
          - feeds
      version:
        description: "stable only: publish as this X.Y.Z instead of the nightly's version (any version above the latest stable that no tag holds)"
        required: false
        default: ""
        type: string
      publish:
        description: "Publish the release (false: build and keep the packages as workflow artifacts)"
        required: true
        default: true
        type: boolean

# Two queues. Nightlies share one so two ticks can never build the same commit
# or publish out of order; stable runs (promotions, tags, feeds-only) share the
# other, so a queued nightly never holds up a promotion. Neither cancels: a
# cancelled release run can leave a draft or a tag behind, and every queued run
# is kept rather than replaced by the next one. The feeds job has a third
# queue of its own, shared by both, so feed uploads never interleave.
concurrency:
  group: desktop-release-${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'nightly')) && 'nightly' || 'stable' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  validate:
    name: Resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The nightly gate reads this workflow's earlier scheduled runs.
      actions: read
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      feeds_only: ${{ steps.resolve.outputs.feeds_only }}
      publish: ${{ steps.resolve.outputs.publish }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      ref: ${{ steps.resolve.outputs.ref }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      previous_sha: ${{ steps.resolve.outputs.previous_sha }}
      source_private: ${{ steps.resolve.outputs.source_private }}
      slug: ${{ steps.resolve.outputs.slug }}
      mac_signing: ${{ steps.secrets.outputs.mac_signing }}
      sparkle: ${{ steps.secrets.outputs.sparkle }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Channel, version, commit and build number for every later job. See the
      # header for the entry points; scripts/release/release.mjs for the rules.
      # A shut gate ends the run here, green, with should_build=false; a refusal
      # (main rewritten under the last nightly, a promotion that cannot ship)
      # exits non-zero and fails the run, so it is seen.
      - name: Resolve channel, version and commit
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_TOKEN: ${{ github.token }}
        run: node scripts/release/release.mjs resolve

      # Before a single runner is spent: the Tauri key is required, and every
      # optional group (Apple, Azure, Sparkle) is all or none. Only whether each
      # secret is set reaches this step, never a value.
      - name: Check the signing secrets
        id: secrets
        if: steps.resolve.outputs.should_build == 'true'
        env:
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_CSC_LINK: ${{ secrets.CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT != '' }}
          HAS_AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' }}
          HAS_AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME != '' }}
          HAS_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
        run: node scripts/release/release.mjs check-secrets

  # The whole CI gate against the exact commit being released. It runs beside
  # the packaging legs; only the publish job waits for it, so it costs no
  # wall-clock time.
  quality:
    name: Quality gate
    needs: validate
    if: needs.validate.outputs.should_build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.ref }}

  package:
    name: Package (${{ matrix.name }})
    needs: validate
    if: needs.validate.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # hostTarget names the leg's transcription host archive
          # (HOST_TARGETS in scripts/release/release-lib.mjs). bundles is
          # empty on a host-only leg, which skips the app packaging and
          # collect steps; platform then only keys the Rust cache and the
          # artifact.
          - name: windows
            os: windows-2022
            platform: windows-x86_64
            target: ""
            bundles: nsis
            hostBinary: src-tauri/target/release/transcription-host.exe
            hostTarget: windows-x64
          # The transcription host only, signed and notarized. Macs run the
          # native apps (the macos-app job), not the Tauri app. No Intel Mac
          # leg: ort ships no prebuilt ONNX Runtime for x86_64-apple-darwin.
          - name: macos-arm64
            os: macos-15
            platform: darwin-aarch64
            target: aarch64-apple-darwin
            bundles: ""
            hostBinary: src-tauri/target/aarch64-apple-darwin/release/transcription-host
            hostTarget: macos-arm64
          - name: linux
            # ubuntu-24.04 (glibc 2.39): the prebuilt ONNX Runtime pulled in by
            # the default Parakeet engine links against glibc >= 2.38, so it
            # cannot be linked on ubuntu-22.04. This raises the glibc floor for
            # the shipped Linux binaries accordingly.
            os: ubuntu-24.04
            platform: linux-x86_64
            target: ""
            bundles: appimage,deb
            hostBinary: src-tauri/target/release/transcription-host
            hostTarget: linux-x64
          # The transcription host only: there is no Linux arm64 desktop app.
          # Same glibc 2.39 floor as the x64 leg.
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux-aarch64
            target: ""
            bundles: ""
            hostBinary: src-tauri/target/release/transcription-host
            hostTarget: linux-arm64

    # Windows runners default to pwsh, where "${VERSION}" is an empty
    # PowerShell variable rather than the job's env; steps that want pwsh say so.
    defaults:
      run:
        shell: bash

    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      # Signs the desktop updater payloads and the host archive; the public
      # half is plugins.updater.pubkey in tauri.conf.json, and every signature
      # is checked against it before it leaves this runner.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm cmake -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config cmake clang libfuse2

      - name: Install frontend dependencies
        run: npm ci

      # Before the build: a nightly or promoted version is not what
      # package.json says at this commit, and the version must be the same in
      # the bundle, the app's own Settings screen and the feeds.
      #
      # A promotion builds the commit a nightly shipped while this workflow
      # file comes from main, so the scripts each step calls are that commit's.
      # Promote only nightlies cut by this version of the pipeline.
      - name: Stamp the release version
        run: node scripts/release/release.mjs stamp "${VERSION}"

      # Packaging is split by platform ONLY so each platform's signing secrets
      # reach no other runner. macOS has no app step: those legs build only the
      # transcription host.
      #
      # Azure Trusted Signing through trusted-signing-cli, which Tauri runs on
      # every binary it signs -- no certificate file, no hardware token. All
      # six secrets sign; none leaves the installer unsigned (SmartScreen warns
      # on first run); a partial set never gets here (validate fails first).
      - name: Package app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          names=(AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TRUSTED_SIGNING_ENDPOINT
                 AZURE_TRUSTED_SIGNING_ACCOUNT_NAME AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME)
          present=0
          for name in "${names[@]}"; do [ -n "${!name}" ] && present=$((present + 1)); done
          config='{"bundle":{"createUpdaterArtifacts":true}}'
          if [ "$present" -eq "${#names[@]}" ]; then
            echo "Windows signing enabled (Azure Trusted Signing)."
            cargo install trusted-signing-cli --locked
            # shellcheck disable=SC2016 # the ${...} are node's template literals, not the shell's
            config=$(node -e '
              const e = process.env
              const sign = `trusted-signing-cli -e ${e.AZURE_TRUSTED_SIGNING_ENDPOINT} -a ${e.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME} -c ${e.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME} %1`
              console.log(JSON.stringify({ bundle: { createUpdaterArtifacts: true, windows: { signCommand: sign } } }))')
          elif [ "$present" -eq 0 ]; then
            echo "Windows signing disabled: no Azure Trusted Signing secrets are set."
          else
            echo "Only ${present} of the ${#names[@]} Azure Trusted Signing secrets are set." >&2
            echo "Set all of them to sign, or none to ship unsigned." >&2
            exit 1
          fi
          npx tauri build --bundles "$BUNDLES" --config "$config"
          echo "BUNDLE_DIR=src-tauri/target/release/bundle" >> "$GITHUB_ENV"

      # createUpdaterArtifacts signs the AppImage and, on Tauri 2, the .deb as
      # well: a .deb install updates from the linux-x86_64-deb entry of
      # desktop-<channel>.json. A CLI that leaves the .deb unsigned has it
      # signed here with the same key, so the entry never goes missing.
      - name: Package app (Linux)
        if: runner.os == 'Linux' && matrix.bundles != ''
        shell: bash
        run: |
          npx tauri build --bundles "$BUNDLES" --config '{"bundle":{"createUpdaterArtifacts":true}}'
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            if [ ! -f "$deb.sig" ]; then
              echo "Signing $(basename "$deb") for the updater."
              npx tauri signer sign "$deb" > /dev/null
            fi
          done
          echo "BUNDLE_DIR=src-tauri/target/release/bundle" >> "$GITHUB_ENV"

      # Renames the bundles so every leg's files can share one release, checks
      # each updater signature against the shipped public key, and writes this
      # leg's share of desktop-manifest.json beside them.
      - name: Collect release files
        if: matrix.bundles != ''
        shell: bash
        run: node scripts/release/release.mjs collect "${{ matrix.platform }}" release-assets

      # `tauri build` builds the frontend on the app legs; the host is a bin
      # of the same crate, whose tauri::generate_context! reads ../dist, so
      # the host-only legs (linux-arm64, macos-arm64) build it here.
      - name: Build frontend (host-only leg)
        if: matrix.bundles == ''
        run: npm run build

      - name: Build transcription host
        shell: bash
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin transcription-host --release ${TARGET:+--target "$TARGET"}

      # The macOS host binary gets the Developer ID signature and hardened
      # runtime, and is notarized, when the Apple secrets are set. CSC_LINK is
      # a "Developer ID Application" certificate exported as a base64 .p12 (the
      # same secret names as sprintengine/studio, so the values carry over).
      # With none of the five set it keeps the linker's ad-hoc signature, with
      # a warning. A bare binary cannot be stapled: Gatekeeper fetches its
      # ticket online the first time a downloaded copy runs. The certificate
      # goes into a temporary keychain of this job's own, never the login one.
      - name: Sign and notarize transcription host (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HOST_BINARY: ${{ matrix.hostBinary }}
        run: |
          set -euo pipefail
          names=(CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID)
          present=0
          for name in "${names[@]}"; do [ -n "${!name}" ] && present=$((present + 1)); done
          if [ "$present" -eq 0 ]; then
            echo "::warning::No Apple signing secrets: the macOS transcription host ships ad-hoc signed and not notarized."
            exit 0
          elif [ "$present" -ne "${#names[@]}" ]; then
            echo "Only ${present} of the ${#names[@]} Apple signing secrets are set." >&2
            echo "Set all of them to sign and notarize, or none to ship ad-hoc signed." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/host-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/host-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/host-signing.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/host-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -nE 's/^ *[0-9]+\) [0-9A-F]+ "(Developer ID Application: .*)"$/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "CSC_LINK holds no Developer ID Application identity." >&2
            exit 1
          fi
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$identity" "$HOST_BINARY"
          codesign --verify --strict --verbose=2 "$HOST_BINARY"
          ditto -c -k "$HOST_BINARY" "$RUNNER_TEMP/host-notarize.zip"
          # No submission id means the upload itself failed (Apple's 5xx); retry
          # that, but a verdict on a submission is final.
          for attempt in 1 2 3; do
            xcrun notarytool submit "$RUNNER_TEMP/host-notarize.zip" --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 45m --output-format json > "$RUNNER_TEMP/host-notarize.json" || true
            if plutil -extract id raw -o - "$RUNNER_TEMP/host-notarize.json" >/dev/null 2>&1 || [ "$attempt" = 3 ]; then break; fi
            echo "The notary upload got no submission id (attempt $attempt of 3); retrying in $((attempt * 60)) s." >&2
            sleep $((attempt * 60))
          done
          status="$(plutil -extract status raw -o - "$RUNNER_TEMP/host-notarize.json" 2>/dev/null || echo "no answer")"
          security delete-keychain "$keychain"
          if [ "$status" != "Accepted" ]; then
            cat "$RUNNER_TEMP/host-notarize.json" >&2 || true
            echo "Notarization of the transcription host ended: ${status}" >&2
            exit 1
          fi
          echo "Transcription host signed as ${identity} and notarized."

      # One folder per platform, named like the archive: the binary, the wire
      # protocol it serves, the systemd and launchd service files, and the
      # licences. tar.gz keeps the binary executable; Windows gets a zip. The
      # host's self-updater extracts <folder>/transcription-host[.exe] from it
      # (hostArchiveLayout in scripts/release/release-lib.mjs, and
      # docs/releasing.md); keep the three in step.
      - name: Package transcription host
        shell: pwsh
        env:
          SLUG: ${{ needs.validate.outputs.slug }}
          HOST_TARGET: ${{ matrix.hostTarget }}
          HOST_BINARY: ${{ matrix.hostBinary }}
        run: |
          if (-not (Test-Path $env:HOST_BINARY)) {
            throw "Expected transcription host binary not found: $env:HOST_BINARY"
          }
          $stem = "$env:SLUG-$env:VERSION-transcription-host-$env:HOST_TARGET"
          $stage = Join-Path $env:RUNNER_TEMP $stem
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item $env:HOST_BINARY $stage
          foreach ($file in @('src-tauri/src/host/PROTOCOL.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md')) {
            if (Test-Path $file) { Copy-Item $file $stage }
          }
          if (Test-Path packaging/host) { Copy-Item packaging/host/* $stage }
          if ($IsWindows) {
            Compress-Archive -Path $stage -DestinationPath "release-assets/$stem.zip" -Force
          } else {
            chmod +x (Join-Path $stage (Split-Path -Leaf $env:HOST_BINARY))
            tar -C $env:RUNNER_TEMP -czf "release-assets/$stem.tar.gz" $stem
            if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" }
          }
          Get-ChildItem -Recurse $stage | ForEach-Object { $_.FullName.Substring($env:RUNNER_TEMP.Length) }

      # The archive signed with the Tauri key (`tauri signer sign`), the
      # signature checked against the shipped public key, and the leg's share
      # of host-manifest.json written: url, sha256, signature, format.
      - name: Sign transcription host archive
        shell: bash
        run: node scripts/release/release.mjs sign-host "${{ matrix.hostTarget }}" release-assets

      # A host for a headless server must not need a desktop. Printed rather
      # than enforced until a release has shown what it links.
      - name: Show the transcription host's shared libraries (Linux)
        if: runner.os == 'Linux'
        run: ldd "${{ matrix.hostBinary }}"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ needs.validate.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: release-assets/*

  # The native macOS apps (apps/macos): the same commit, version and build
  # number as every other leg, on the same release. Release configuration,
  # Developer ID signed with the hardened runtime, notarized and stapled by
  # apps/macos/scripts/release.sh -- the script a maintainer runs locally:
  #
  #   release.sh               Fairspoken.app as Fairspoken-<version>-macos-arm64.zip
  #                            and .dmg, and sparkle-fairspoken.json
  #   release.sh --app server  Fairspoken Server.app as
  #                            Fairspoken-Server-<version>-macos-arm64.zip and .dmg,
  #                            and sparkle-fairspoken-server.json
  #
  # The .zip (ditto --sequesterRsrc --keepParent of the stapled app) is the
  # Sparkle enclosure, EdDSA-signed with SPARKLE_ED_PRIVATE_KEY by Sparkle's own
  # sign_update; the DMG is for people. CFBundleVersion is the release's build
  # number (YYYYMMDDHHMM), passed as CURRENT_PROJECT_VERSION.
  #
  # Apple Silicon only (the apps need macOS 26 and the Neural Engine). They
  # need the macOS 26 SDK, so Xcode 26 on macos-26, pinned by path as in ci.yml.
  #
  # Bundle ids ie.fairspoken.mac (client) and ie.fairspoken.server (server), the
  # same on both channels: macOS keys Microphone and Accessibility grants on the
  # bundle id, so moving between nightly and stable keeps them.
  macos-app:
    name: Package (macos-app-arm64)
    needs: validate
    if: needs.validate.outputs.should_build == 'true'
    runs-on: macos-26
    # Two apps, each built, then notarized twice (the app, then its DMG).
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      # Sparkle's sign_update, from the official release tarball, pinned by
      # version and checksum. Only when the apps are notarized and the Sparkle
      # key is set: nothing else is ever an update.
      - name: Install Sparkle tools
        if: needs.validate.outputs.sparkle == 'true'
        env:
          SPARKLE_VERSION: "2.10.0"
          SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" ./bin
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodegen --version

      # Spotlight indexes each DMG the moment hdiutil mounts it and holds the
      # volume open, so the detach fails "Resource busy" (Studio hit this).
      - name: Stop Spotlight indexing
        run: sudo mdutil -a -i off

      # All five secrets sign and notarize; none ships ad-hoc signed builds
      # named -unsigned, with a warning. CSC_LINK is the Developer ID
      # Application .p12 (base64) shared with the host legs and with Studio. It
      # is imported into a temporary keychain that only this job uses, and both
      # apps are signed from it.
      - name: Import the Developer ID certificate
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          names=(CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID)
          present=0
          for name in "${names[@]}"; do [ -n "${!name}" ] && present=$((present + 1)); done
          if [ "$present" -eq 0 ]; then
            echo "::warning::No Apple signing secrets are set; the native macOS apps ship ad-hoc signed, not notarized, and named -unsigned."
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$present" -ne "${#names[@]}" ]; then
            echo "Only ${present} of the ${#names[@]} Apple signing secrets are set." >&2
            echo "Set all of them to sign and notarize, or none to ship unsigned." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/app-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          # Locks after three hours idle: longer than the job may run.
          security set-keychain-settings -lut 10800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/app-signing.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/app-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "FS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "mode=notarize" >> "$GITHUB_OUTPUT"
          echo "Developer ID certificate imported; the apps will be signed and notarized."

      - name: Build, sign, notarize and package Fairspoken (client)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ needs.validate.outputs.sparkle == 'true' && secrets.SPARKLE_ED_PRIVATE_KEY || '' }}
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          args=(--version "$VERSION" --build-number "$BUILD_NUMBER" --out "$GITHUB_WORKSPACE/release-assets")
          if [ "$MODE" = "unsigned" ]; then args+=(--unsigned); fi
          apps/macos/scripts/release.sh "${args[@]}"

      # The same version, build number, output folder, secrets and unsigned
      # fallback as the client.
      - name: Build, sign, notarize and package Fairspoken Server
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ needs.validate.outputs.sparkle == 'true' && secrets.SPARKLE_ED_PRIVATE_KEY || '' }}
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          args=(--app server --version "$VERSION" --build-number "$BUILD_NUMBER" --out "$GITHUB_WORKSPACE/release-assets")
          if [ "$MODE" = "unsigned" ]; then args+=(--unsigned); fi
          apps/macos/scripts/release.sh "${args[@]}"

      # Each sparkle-<app>.json against its zip and against the SUPublicEDKey
      # the app ships: a key that does not match fails here, not in every
      # installed app.
      - name: Check the Sparkle metadata
        run: node scripts/release/release.mjs check-sparkle release-assets

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-app-${{ needs.validate.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: release-assets/*

      - name: Remove the signing keychain
        if: always() && env.FS_KEYCHAIN != ''
        run: security delete-keychain "$FS_KEYCHAIN" || true

  publish:
    name: Publish release
    needs: [validate, quality, package, macos-app]
    if: needs.validate.outputs.should_build == 'true' && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # To create the release, and the tag it sits on, in this repository.
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
      CHANNEL: ${{ needs.validate.outputs.channel }}
      REF: ${{ needs.validate.outputs.ref }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-${{ needs.validate.outputs.version }}
          merge-multiple: true
          path: release-assets

      - name: Merge the desktop and host manifests
        run: node scripts/release/release.mjs merge-manifests release-assets

      - name: Write release notes
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_PRIVATE: ${{ needs.validate.outputs.source_private }}
          PREVIOUS_SHA: ${{ needs.validate.outputs.previous_sha }}
        run: node scripts/release/release.mjs notes release-notes.md

      # Draft first, every file uploaded, and only then visible. The feeds are
      # rendered from published releases only, so nothing points at a release
      # still filling up.
      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT="$(node -p "require('./src-tauri/tauri.conf.json').productName")"

          # --target does not move an existing tag. A retry must never publish
          # packages whose source differs from the tag the release advertises.
          if tagged_ref=$(git rev-parse --verify "refs/tags/${TAG}^{commit}" 2>/dev/null); then
            if [ "$tagged_ref" != "$REF" ]; then
              echo "${TAG} points at ${tagged_ref}, not the built commit ${REF}." >&2
              exit 1
            fi
          fi

          # A draft left by an earlier failed attempt of this same version.
          if gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            echo "Removing the draft left by an earlier attempt."
            gh release delete "$TAG" --repo "$REPO" --yes
          fi

          # Only a stable is ever latest.
          if [ "$CHANNEL" = "stable" ]; then
            flags=()
            latest="--latest"
          else
            flags=(--prerelease)
            latest="--latest=false"
          fi

          # --target: a tag that does not exist yet is created on the commit
          # that was built, not on whatever main has moved to since. For a
          # promotion that is the nightly's commit, which is how the stable tag
          # lands on it.
          gh release create "$TAG" --repo "$REPO" --target "$REF" --draft "${flags[@]}" \
            --title "${PRODUCT} ${VERSION}" \
            --notes-file release-notes.md \
            release-assets/*
          gh release edit "$TAG" --repo "$REPO" --draft=false "$latest"

      # With the job's token: every product, every metadata file, and each one
      # usable (signatures present, urls on this release, Sparkle lengths
      # matching the zips).
      - name: Verify the published release
        run: node scripts/release/release.mjs verify-release

      # A promoted stable has no tag in the source repo yet; a pushed one does.
      # `gh release create --target` above normally creates it already; this
      # stays as the guard. The workflow's own token does not trigger another run.
      - name: Tag the source commit
        if: needs.validate.outputs.channel == 'stable' && github.event_name != 'push'
        run: |
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists on ${REPO}."
          else
            gh api "repos/${REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${REF}"
          fi

  # Re-renders every update feed from the releases that exist now and uploads
  # them to the update-feeds release, then reads them back without credentials,
  # then deletes the nightlies past the newest three -- which the feeds just
  # rendered already leave out, so no feed ever points at a deleted asset.
  # One queue for both trains: two publishes never interleave their uploads,
  # and the later always renders from a list holding the earlier's release.
  feeds:
    name: Update feeds
    needs: [validate, publish]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.validate.outputs.feeds_only == 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-update-feeds
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.feeds_only != 'true' && needs.validate.outputs.tag || '' }}
      CHANNEL: ${{ needs.validate.outputs.channel }}
      REF: ${{ needs.validate.outputs.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Render and upload the update feeds
        run: node scripts/release/release.mjs update-feeds "$RUNNER_TEMP/update-feeds"

      # The exact URLs installed apps read, with no credential at all: a
      # private or misnamed repository fails here rather than in the silence of
      # apps that never find an update. Also that /releases/latest is a stable.
      - name: Read the feeds back without credentials
        run: node scripts/release/release.mjs verify-public "$RUNNER_TEMP/update-feeds"

      # Their tags stay. After the feeds, so the newest nightly is the one just
      # made; a failure here leaves everything published, so it does not fail
      # the job.
      - name: Delete the older nightly releases
        if: needs.validate.outputs.channel == 'nightly' && needs.validate.outputs.feeds_only != 'true'
        continue-on-error: true
        run: node scripts/release/release.mjs prune-nightlies

      - name: Keep the rendered feeds
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: update-feeds-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: ${{ runner.temp }}/update-feeds/*
